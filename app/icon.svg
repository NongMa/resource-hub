<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="资料管家">
  <defs>
    <linearGradient id="brand-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <!-- 品牌主色底板：浅色/深色标签栏都能看到 -->
  <rect width="48" height="48" rx="11" fill="url(#brand-bg)" />
  <!-- 后层文档：小尺寸下只保留一层，避免 16px 叠层糊在一起 -->
  <rect x="12" y="19" width="16" height="20" rx="3" fill="#f8fafc" opacity="0.3" />
  <!-- 前层文档 + 折角：16px 下主要靠这个白色文档轮廓辨识 -->
  <path d="M22 9h10l7 7v18a3 3 0 0 1-3 3H22a3 3 0 0 1-3-3V12a3 3 0 0 1 3-3Z" fill="#f8fafc" />
  <path d="M32 9.8v6.6h6.4" fill="none" stroke="#2563eb" stroke-opacity="0.5" stroke-width="2" stroke-linejoin="round" />
</svg>
